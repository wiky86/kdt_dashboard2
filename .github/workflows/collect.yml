name: KDT 데이터 수집

on:
  schedule:
    # 평일(월~금) 새벽 3시 17분 KST = 전날 18:17 UTC (일~목)
    - cron: "17 18 * * 0-4"
  workflow_dispatch:
    inputs:
      mode:
        description: "실행 방식"
        type: choice
        default: normal
        options:
          - normal      # 최근 약 15개월 ~ 6개월 뒤 개강 회차
          - full        # KDT 시작(2020-12)부터 전체 (처음 한 번)
          - inspect     # API 원본·상세 페이지 샘플만 저장 (DB에 안 씀)
          - migrate     # 구글 시트(시트4) 기존 데이터를 Supabase로 1회 이전
      max_scrape:
        description: "상세 페이지 최대 크롤링 수"
        default: "400"

concurrency:
  group: kdt-collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      MAX_SCRAPE: ${{ github.event.inputs.max_scrape || '400' }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - name: 패키지 설치
        run: pip install -r crawler/requirements.txt

      - name: 시크릿 확인
        run: |
          missing=""
          [ -z "$SUPABASE_URL" ] && missing="$missing SUPABASE_URL"
          [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] && missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ "${{ github.event.inputs.mode }}" != "migrate" ] && [ -z "$WORK24_API_KEY" ]; then
            missing="$missing WORK24_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error::저장소 Settings > Secrets and variables > Actions 에 다음 시크릿을 추가하세요:$missing"
            exit 1
          fi

      - name: 수집 실행
        run: |
          mode="${{ github.event.inputs.mode || 'normal' }}"
          mkdir -p out
          case "$mode" in
            full)    python -m crawler.main --full --max-api-calls 20000 --csv out/sessions.csv ;;
            inspect) python -m crawler.main --inspect out/inspect --dry-run --max-scrape 5 --since "$(date -d '-60 days' +%F)" --until "$(date +%F)" --csv out/sessions.csv ;;
            migrate) python -m crawler.migrate_sheet ;;
            *)       python -m crawler.main --csv out/sessions.csv ;;
          esac

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kdt-collect-${{ github.run_id }}
          path: out/
          retention-days: 14
          if-no-files-found: ignore
